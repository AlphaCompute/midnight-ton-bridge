name: alphaton-bridge-local
services:
  node:
    image: midnightntwrk/midnight-node:1.0.0
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    ports: ['127.0.0.1:19944:9944']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf -H "content-type: application/json" --data ''{"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":[1]}'' http://localhost:9944 | grep -q ''"result":"0x''']
      interval: 5s
      timeout: 5s
      retries: 30
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ['midnight-proof-server', '-v']
    ports: ['127.0.0.1:16300:6300']
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    env_file: infrastructure/local-indexer.env
    environment:
      APP__INFRA__NODE__URL: ws://node:9944
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: e2e-test-dummy-id
    ports: ['127.0.0.1:18088:8088']
    depends_on:
      node:
        condition: service_healthy
