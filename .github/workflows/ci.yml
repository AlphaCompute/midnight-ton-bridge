name: bridge-validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: bash scripts/bootstrap.sh
      - run: npm run check
      - run: npm --prefix examples/notes ci && npm --prefix examples/notes test
      - run: mkdir -p tmp && npm pack --json --pack-destination tmp > tmp/pack.json && node scripts/check-package.mjs tmp/pack.json
